name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "NaUlitsu/**"
      - "project.yml"
      - ".github/workflows/ipa.yml"

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app (iphoneos arm64)
        run: |
          xcodebuild \
            -project NaUlitsu.xcodeproj \
            -scheme NaUlitsu \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Pack IPA
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'NaUlitsu.app' | head -n 1)
          if [ -z "$APP" ]; then APP=$(find . -name 'NaUlitsu.app' | head -n 1); fi
          echo "APP=$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r NaUlitsu.ipa Payload
          ls -lh NaUlitsu.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NaUlitsu-unsigned-ipa
          path: NaUlitsu.ipa
