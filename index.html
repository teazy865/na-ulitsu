<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#121a28"/>
<title>На улицу</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<style>
:root{--bg1:#1e3a5f;--bg2:#0e1520;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.12);--text:#f4f7fb;--muted:rgba(244,247,251,.62);--accent:#f2c75c;--good:#73d99e;--warn:#f5a35a;--bad:#ef6b6b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0e1520;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
body{background:linear-gradient(180deg,var(--bg1),var(--bg2) 55%);padding:calc(env(safe-area-inset-top)+12px) 18px calc(72px + env(safe-area-inset-bottom))}
h1{font-size:15px;font-weight:600;margin:0;color:var(--muted)}.place{font-size:20px;font-weight:650;margin:2px 0 0}
.hero{display:flex;align-items:flex-end;justify-content:space-between;margin-top:18px}
.temp{font-size:92px;font-weight:300;letter-spacing:-4px;line-height:.9}.feel{color:var(--muted);font-size:16px;margin-top:8px}.icon-big{font-size:52px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px}
.advice{display:flex;gap:12px;align-items:flex-start}.advice+.advice{margin-top:10px}.dot{width:34px;text-align:center;font-size:22px}
.title{font-weight:650}.detail{color:var(--muted);font-size:14px;margin-top:3px}
.hours{display:flex;gap:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.hour{min-width:52px;text-align:center}.hour .t{color:var(--muted);font-size:12px}.hour .d{font-weight:650;margin-top:6px}.hour .p{color:var(--muted);font-size:10px;margin-top:4px;line-height:1.2}
.metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.days{display:flex;flex-direction:column;gap:0}.day{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.day:last-child{border-bottom:0}.day .name{flex:1}.day .sub{color:var(--muted);font-size:12px}.wknd{color:#f3a0b5}
.rain{color:var(--muted);font-size:11px;text-align:right;min-width:72px}.rain b{display:block;color:var(--text);font-size:14px}
.search{width:100%;border:0;border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.1);color:#fff;font-size:16px}
.hit{padding:12px 0;border-bottom:1px solid var(--line)}.hit small{color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 18px calc(10px + env(safe-area-inset-bottom));background:rgba(14,21,32,.88);backdrop-filter:blur(16px)}
.tabs button{flex:1;background:0;border:0;color:var(--muted);padding:10px;font-size:13px;font-weight:600}.tabs button.on{color:var(--accent)}
.err,.load{text-align:center;margin-top:48px;color:var(--muted)}
button.link{background:var(--accent);color:#1a1406;border:0;border-radius:12px;padding:10px 16px;font-weight:700}
button.back{background:0;border:0;color:var(--accent);padding:0;font-size:15px;font-weight:650}
.tone-good{color:var(--good)}.tone-warn{color:var(--warn)}.tone-bad{color:var(--bad)}
.hidden{display:none!important}
.votes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.vote{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.pill{font-size:12px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.08)}
.pill.yes{color:var(--bad)}.pill.no{color:var(--good)}
.periods{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;text-align:center}
.period{background:rgba(255,255,255,.06);border-radius:16px;padding:12px 6px}
.period .lab{color:var(--muted);font-size:12px;margin-bottom:6px}
.period .tt{font-size:22px;font-weight:650}
.period .ff{color:var(--muted);font-size:12px;margin-top:4px}
.range{display:flex;justify-content:space-between;gap:10px}.range div{flex:1}
</style>
</head>
<body>
<div id="view-today"><h1>На улицу</h1><div class="place" id="place">Определяю место…</div><div id="today-body" class="load">Загружаю прогноз</div></div>
<div id="view-day" class="hidden"><button class="back" id="back-days">← Назад</button><h1 id="day-h1">День</h1><div class="place" id="day-place"></div><div id="day-body"></div></div>
<div id="view-places" class="hidden"><h1>Места</h1><div class="place">Город или геолокация</div><div class="card"><input class="search" id="q" placeholder="Найти город"/><button class="link" style="margin-top:12px;width:100%" id="geo">Моё местоположение</button><div id="hits"></div></div></div>
<nav class="tabs"><button class="on" data-tab="today">Сейчас</button><button data-tab="places">Места</button></nav>
<script>
const MODELS=[{id:"ecmwf_ifs025",name:"ECMWF"},{id:"icon_seamless",name:"ICON"},{id:"gfs_seamless",name:"GFS"}];
const WMO={symbol(c,day=true){if(c===0)return day?"☀️":"🌙";if(c<=2)return"⛅";if(c===3)return"☁️";if(c===45||c===48)return"🌫️";if(c>=51&&c<=57)return"🌦️";if(c>=61&&c<=67)return"🌧️";if(c>=71&&c<=77)return"🌨️";if(c>=80&&c<=82)return"🌧️";if(c>=85)return c>=95?"⛈️":"🌨️";return"☁️"},
phrase(c){return({0:"Ясно",1:"Почти ясно",2:"Переменная облачность",3:"Пасмурно",45:"Туман",51:"Морось",61:"Небольшой дождь",63:"Дождь",65:"Сильный дождь",71:"Небольшой снег",73:"Снег",80:"Ливень",95:"Гроза"})[c]||"Смешанная погода"}};
function parseHours(j,limit){const now=Date.now(),hours=[];if(!j||!j.hourly)return hours;for(let i=0;i<j.hourly.time.length;i++){const t=new Date(j.hourly.time[i]);hours.push({t,temp:j.hourly.temperature_2m[i],app:j.hourly.apparent_temperature?j.hourly.apparent_temperature[i]:j.hourly.temperature_2m[i],prob:j.hourly.precipitation_probability?.[i]??0,precip:j.hourly.precipitation?.[i]??0,code:j.hourly.weather_code?.[i]??0,wind:j.hourly.wind_speed_10m?.[i]??0})}return limit?hours.filter(h=>h.t.getTime()>=now-36e5).slice(0,limit):hours}
function modelVote(hours){const soon=hours.slice(0,6);if(!soon.length)return{rain:false,maxProb:0};const maxProb=Math.max(...soon.map(h=>h.prob||0)),maxPrecip=Math.max(...soon.map(h=>h.precip||0));return{rain:maxProb>=45||maxPrecip>=.2,maxProb}}
function consensus(votes){const ok=votes.filter(Boolean),yes=ok.filter(v=>v.vote.rain),n=ok.length||1,share=yes.length/n,avg=Math.round(ok.reduce((s,v)=>s+v.vote.maxProb,0)/n);let title,detail,tone,s;if(!yes.length){title="Можно без зонта";detail=`Ни одна из ${ok.length} моделей не ждёт осадки в ближайшие часы.`;tone="good";s="✅"}else if(yes.length===1){title="Дождь возможен";detail=`Только ${yes[0].name} видит осадки. Уверенность ${Math.round(share*100)}%.`;tone="warn";s="☔️"}else if(yes.length===ok.length){title="Зонт обязателен";detail=`Все ${ok.length} модели согласны. Средняя вероятность ${avg}%.`;tone="bad";s="☔"}else{title="Возьмите зонт";detail=`${yes.length} из ${ok.length} моделей ждут дождь. Уверенность ${Math.round(share*100)}%.`;tone="warn";s="🌂"}return{title,detail,tone,s,votes:ok}}
function extraAdvice(cur,hours){const soon=hours.slice(0,6),snow=[71,73,75,77,85,86].includes(cur.code)||soon.some(h=>[71,73,75,77,85,86].includes(h.code)),windy=cur.wind>=35||soon.some(h=>h.wind>=40),items=[];if(snow||cur.temp<=0)items.push({t:"Гололёд возможен",d:"Осторожнее на выходе и за рулём.",s:"❄️",tone:"warn"});if(cur.app>=26)items.push({t:"Жара",d:"Вода, кепка, лучше тень в полдень.",s:"🥵",tone:"warn"});else if(cur.app<=0)items.push({t:"Оденьтесь теплее",d:`Ощущается ${Math.round(cur.app)}°.`,s:"🧣",tone:"warn"});if(windy)items.push({t:"Сильный ветер",d:"Капюшон и ветровка.",s:"💨",tone:"warn"});return items.slice(0,2)}
function ymd(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function periodOf(h){const hr=h.t.getHours();if(hr<6)return"night";if(hr<12)return"morn";if(hr<18)return"day";return"eve"}
function agg(list){if(!list.length)return null;const mid=list[Math.floor(list.length/2)];return{temp:Math.round(list.reduce((s,h)=>s+h.temp,0)/list.length),app:Math.round(list.reduce((s,h)=>s+h.app,0)/list.length),prob:Math.round(Math.max(...list.map(h=>h.prob))),code:mid.code}}
function daysHtml(j){const labels=["Сегодня","Завтра"];const wd=new Intl.DateTimeFormat("ru-RU",{weekday:"long"});const dt=new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"long"});return j.daily.time.map((d,i)=>{const dd=new Date(d),weekend=dd.getDay()===0||dd.getDay()===6,name=labels[i]||wd.format(dd),p=j.daily.precipitation_probability_max[i];return `<div class="day" data-i="${i}"><div>${WMO.symbol(j.daily.weather_code[i])}</div><div class="name ${weekend?"wknd":""}">${dt.format(dd)}<div class="sub ${weekend?"wknd":""}">${name}</div></div><div class="rain">вероятность дождя<b>${p}%</b></div><b>${Math.round(j.daily.temperature_2m_min[i])}° / ${Math.round(j.daily.temperature_2m_max[i])}°</b></div>`}).join("")}
let state={lat:55.75,lon:37.62,name:"Москва",main:null};
async function load(lat,lon,name){state.lat=lat;state.lon=lon;state.name=name;document.getElementById("place").textContent=name;document.getElementById("today-body").innerHTML='<div class="load">Считаю ECMWF, ICON и GFS…</div>';const mainUrl=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max&timezone=auto&forecast_days=10`;try{const [main,...models]=await Promise.all([fetch(mainUrl).then(r=>r.json()),...MODELS.map(m=>fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m&timezone=auto&forecast_days=2&models=${m.id}`).then(r=>r.json()).catch(()=>null))]);state.main=main;render(main,models)}catch(e){document.getElementById("today-body").innerHTML='<div class="err">Нет сети.<br><br><button class="link" onclick="load(state.lat,state.lon,state.name)">Повторить</button></div>'}}
function openDay(i){const j=state.main;if(!j)return;const date=j.daily.time[i];const dayHours=parseHours(j).filter(h=>ymd(h.t)===ymd(date));const buckets={night:[],morn:[],day:[],eve:[]};dayHours.forEach(h=>buckets[periodOf(h)].push(h));const parts=[{k:"morn",lab:"Утро"},{k:"day",lab:"День"},{k:"eve",lab:"Вечер"},{k:"night",lab:"Ночь"}].map(p=>({...p,v:agg(buckets[p.k])}));const tmax=Math.round(j.daily.temperature_2m_max[i]),tmin=Math.round(j.daily.temperature_2m_min[i]);const amax=Math.round(j.daily.apparent_temperature_max?.[i]??tmax),amin=Math.round(j.daily.apparent_temperature_min?.[i]??tmin);const p=j.daily.precipitation_probability_max[i];const long=new Intl.DateTimeFormat("ru-RU",{weekday:"long",day:"numeric",month:"long"}).format(new Date(date));document.getElementById("day-h1").textContent=long;document.getElementById("day-place").textContent=state.name;document.getElementById("day-body").innerHTML=`<div class="card range"><div><div class="detail">Дёнь</div><div class="title">${tmax}°</div><div class="detail">ощущается ${amax}°</div></div><div><div class="detail">Ночь</div><div class="title">${tmin}°</div><div class="detail">ощущается ${amin}°</div></div></div><div class="card"><div class="title">Вероятность дождя</div><div class="detail" style="font-size:22px;color:var(--text);margin-top:6px">${p}%</div></div><div class="card"><div class="title" style="margin-bottom:12px">По частям суток</div><div class="periods">${parts.map(p=>p.v?`<div class="period"><div class="lab">${p.lab}</div><div>${WMO.symbol(p.v.code,p.k!=="night")}</div><div class="tt">${p.v.temp}°</div><div class="ff">ощ. ${p.v.app}°</div><div class="ff">дождь ${p.v.prob}%</div></div>`:`<div class="period"><div class="lab">${p.lab}</div><div class="ff">нет данных</div></div>`).join("")}</div></div><div class="card"><div class="title" style="margin-bottom:12px">Почасовка</div><div class="hours">${dayHours.map(h=>`<div class="hour"><div class="t">${String(h.t.getHours()).padStart(2,"0")}</div><div>${WMO.symbol(h.code,h.t.getHours()>=6&&h.t.getHours()<21)}</div><div class="d">${Math.round(h.temp)}°</div><div class="p">дождь<br>${h.prob}%</div></div>`).join("")||"нет данных"}</div></div>`;show("day")}
function render(j,modelJsons){const c={temp:j.current.temperature_2m,app:j.current.apparent_temperature,code:j.current.weather_code,wind:j.current.wind_speed_10m,hum:j.current.relative_humidity_2m,precip:j.current.precipitation,isDay:j.current.is_day===1};const hours=parseHours(j,24);const votes=MODELS.map((m,i)=>{const data=modelJsons[i];return data?{name:m.name,vote:modelVote(parseHours(data,24))}:null}).filter(Boolean);const cons=consensus(votes);const extra=extraAdvice(c,hours);document.getElementById("place").textContent=state.name;document.getElementById("today-body").innerHTML=`<div class="hero"><div><div class="temp">${Math.round(c.temp)}°</div><div class="feel">${WMO.phrase(c.code)} · ощущается ${Math.round(c.app)}°</div></div><div class="icon-big">${WMO.symbol(c.code,c.isDay)}</div></div><div class="card advice"><div class="dot tone-${cons.tone}">${cons.s}</div><div><div class="title">${cons.title}</div><div class="detail">${cons.detail}</div><div class="votes">${cons.votes.map(v=>`<div class="vote"><span>${v.name}</span><span class="pill ${v.vote.rain?"yes":"no"}">${v.vote.rain?"осадки":"сухо"} · ${Math.round(v.vote.maxProb)}%</span></div>`).join("")}</div></div></div>${extra.map(a=>`<div class="card advice"><div class="dot tone-${a.tone}">${a.s}</div><div><div class="title">${a.t}</div><div class="detail">${a.d}</div></div></div>`).join("")}<div class="card"><div class="title" style="margin-bottom:12px">Ближайшие часы</div><div class="hours">${hours.map(h=>`<div class="hour"><div class="t">${String(h.t.getHours()).padStart(2,"0")}</div><div>${WMO.symbol(h.code)}</div><div class="d">${Math.round(h.temp)}°</div><div class="p">дождь<br>${h.prob}%</div></div>`).join("")}</div></div><div class="card"><div class="title" style="margin-bottom:8px">10 дней</div><div class="days">${daysHtml(j)}</div></div><div class="metrics"><div class="card"><label>Ветер</label><b>${Math.round(c.wind)} км/ч</b></div><div class="card"><label>Влажность</label><b>${c.hum}%</b></div><div class="card"><label>Осадки</label><b>${c.precip.toFixed(1)} мм</b></div></div>`;document.querySelectorAll("#today-body .day").forEach(el=>el.onclick=()=>openDay(+el.dataset.i))}
function useGeo(){if(!navigator.geolocation)return load(55.75,37.62,"Москва");navigator.geolocation.getCurrentPosition(async pos=>{const {latitude:lat,longitude:lon}=pos.coords;let name="Здесь";try{const g=await(await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&language=ru`)).json();name=g?.name||g?.city||name}catch(e){}load(lat,lon,name)},()=>load(55.75,37.62,"Москва"),{timeout:8000})}
document.getElementById("geo").onclick=useGeo;document.getElementById("back-days").onclick=()=>show("today");
let timer;document.getElementById("q").addEventListener("input",e=>{clearTimeout(timer);const v=e.target.value.trim();timer=setTimeout(async()=>{const box=document.getElementById("hits");if(v.length<2){box.innerHTML="";return}const j=await(await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=8&language=ru`)).json();box.innerHTML=(j.results||[]).map(r=>`<div class="hit" data-lat="${r.latitude}" data-lon="${r.longitude}" data-name="${r.name}"><b>${r.name}</b><br><small>${[r.admin1,r.country].filter(Boolean).join(", ")}</small></div>`).join("");box.querySelectorAll(".hit").forEach(el=>el.onclick=()=>{load(+el.dataset.lat,+el.dataset.lon,el.dataset.name);show("today")})},280)});
const views={today:"view-today",day:"view-day",places:"view-places"};
function show(tab){Object.entries(views).forEach(([k,id])=>document.getElementById(id).classList.toggle("hidden",k!==tab));document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===(tab==="day"?"today":tab)))}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>show(b.dataset.tab));
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
useGeo();
</script>
</body></html>
