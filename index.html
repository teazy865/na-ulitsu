<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#07080c"/>
<title>На улицу</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07080c;color:#f3f5fa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
body{padding:calc(env(safe-area-inset-top)+10px) 0 calc(78px + env(safe-area-inset-bottom));background:radial-gradient(900px 420px at 50% -8%,#1a2233 0%,#07080c 58%)}
.pad{padding:0 20px}
.top{text-align:center;font-weight:700;font-size:17px}
.status{width:max-content;margin:10px auto 0;background:#161922;border-radius:999px;padding:5px 10px;font-size:12px;color:#c9cddd}
.hero{text-align:center;margin-top:10px}
.icon-big{font-size:88px;line-height:1}
.deg{font-size:86px;font-weight:620;letter-spacing:-4px;line-height:.92;color:#fff}
.cond{color:#c5c9d6;font-size:20px;margin-top:4px}
.feel{color:#8b90a0;font-size:13px;margin-top:4px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;background:#14161d;border-radius:24px;margin:18px 20px 0;padding:14px 4px;text-align:center}
.stats div+div{border-left:1px solid rgba(255,255,255,.08)}
.stats b{display:block;font-size:14px}.stats label{color:#8b90a0;font-size:11px;margin-top:3px;display:block}
.row-title{display:flex;justify-content:space-between;margin:20px 20px 10px;font-weight:650;color:#d8dbe6}
.row-title small{color:#8b90a0;font-weight:500}
.hours{display:flex;gap:10px;overflow-x:auto;padding:0 20px 6px;-webkit-overflow-scrolling:touch}
.hour{min-width:62px;background:#14161d;border-radius:18px;padding:10px 8px;text-align:center;flex:0 0 auto}
.hour.on{background:linear-gradient(180deg,#4aa2ff,#2f7bff)}
.hour .d{font-weight:700}.hour .t{color:#8b90a0;font-size:11px;margin-top:4px}.hour.on .t{color:#eef5ff}
.days{padding:0 10vw}
.day{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:54px}
.day .wd{justify-self:start;color:#9aa1b4;font-weight:600;font-size:15px}
.day .mid{justify-self:center;display:flex;align-items:center;gap:8px}
.day .ico{font-size:24px;line-height:1}
.day .lab{font-weight:600;font-size:16px}
.day .temps{justify-self:end;font-weight:700;font-size:15px;white-space:nowrap}
.day .temps .mn{color:#8b90a0;margin-left:8px}
.card{background:#14161d;border-radius:22px;padding:14px;margin:12px 20px 0}
.detail{color:#8b90a0;font-size:13px;margin-top:3px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 18px calc(10px + env(safe-area-inset-bottom));background:rgba(7,8,12,.94)}
.tabs button{flex:1;background:0;border:0;color:#8b90a0;padding:10px;font-weight:700}.tabs button.on{color:#fff}
.search{width:100%;border:0;border-radius:16px;padding:12px 14px;background:#1c1f28;color:#fff;font-size:16px}
button.back{background:0;border:0;color:#fff;font-size:15px;font-weight:650;padding:0 0 8px 20px}
.hidden{display:none!important}
.periods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.period{background:#1c1f28;border-radius:16px;padding:12px 4px}
.period .l{color:#8b90a0;font-size:12px}.period .tt{font-size:20px;font-weight:700;margin-top:4px}
</style>
</head>
<body>
<div id="view-today">
  <div class="top" id="place">📍 Минск</div>
  <div id="today-body"></div>
</div>
<div id="view-day" class="hidden">
  <button class="back" id="back">‹ Назад</button>
  <div class="top" id="day-h1"></div>
  <div id="day-body"></div>
</div>
<div id="view-places" class="hidden">
  <div class="top">Места</div>
  <div class="card"><input class="search" disabled placeholder="Поиск отключён"/><div class="detail">Без API.</div></div>
</div>
<nav class="tabs"><button class="on" data-tab="today">Сейчас</button><button data-tab="places">Места</button></nav>
<script>
const WMO={symbol(c){if(c===0)return"☀️";if(c<=2)return"⛅";if(c===3)return"☁️";if(c>=95)return"⛈️";if(c>=71)return"❄️";if(c>=61)return"🌧️";return"☁️"},
short(c){if(c<=1)return"Ясно";if(c===2)return"Облачно";if(c===3)return"Пасмурно";if(c>=95)return"Гроза";if(c>=71)return"Снег";if(c>=61)return"Дождь";return"Облачно"}};
const WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
function mock(){
  const now=new Date();now.setMinutes(0,0,0);
  const hourly={time:[],temperature_2m:[],apparent_temperature:[],precipitation_probability:[],weather_code:[]};
  const daily={time:[],weather_code:[],temperature_2m_max:[],temperature_2m_min:[],precipitation_probability_max:[]};
  const codes=[63,63,95,3,95,61,95,2,61,0];
  for(let d=0;d<10;d++){
    const day=new Date(now);day.setDate(now.getDate()+d);day.setHours(0,0,0,0);
    daily.time.push(day.toISOString());daily.weather_code.push(codes[d]);
    daily.temperature_2m_max.push(20+(d%6));daily.temperature_2m_min.push(14+(d%5));
    daily.precipitation_probability_max.push([72,55,80,20,88,60,70,15,40,5][d]);
    for(let h=0;h<24;h++){
      const t=new Date(day);t.setHours(h);
      hourly.time.push(t.toISOString());
      hourly.temperature_2m.push(16+Math.round(6*Math.sin((h-8)/4)));
      hourly.apparent_temperature.push(15+Math.round(6*Math.sin((h-8)/4)));
      hourly.precipitation_probability.push(h>=10&&h<=18?70:20);
      hourly.weather_code.push(codes[d]);
    }
  }
  return {current:{temperature_2m:23,apparent_temperature:21,weather_code:95,relative_humidity_2m:24,wind_speed_10m:13},hourly,daily};
}
function parseHours(j,limit){const now=Date.now(),hours=[];for(let i=0;i<j.hourly.time.length;i++){const t=new Date(j.hourly.time[i]);hours.push({t,temp:j.hourly.temperature_2m[i],app:j.hourly.apparent_temperature[i],prob:j.hourly.precipitation_probability[i],code:j.hourly.weather_code[i]})}return limit?hours.filter(h=>h.t.getTime()>=now-36e5).slice(0,limit):hours}
function ymd(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
const state={name:"Минск",main:null};
function daysHtml(j){return j.daily.time.map((d,i)=>`<div class="day" data-i="${i}"><div class="wd">${WD[new Date(d).getDay()]}</div><div class="mid"><span class="ico">${WMO.symbol(j.daily.weather_code[i])}</span><span class="lab">${WMO.short(j.daily.weather_code[i])}</span></div><div class="temps">+${Math.round(j.daily.temperature_2m_max[i])}°<span class="mn">+${Math.round(j.daily.temperature_2m_min[i])}°</span></div></div>`).join("")}
function openDay(i){
  const j=state.main,date=j.daily.time[i],tmax=Math.round(j.daily.temperature_2m_max[i]),tmin=Math.round(j.daily.temperature_2m_min[i]);
  const hours=parseHours(j).filter(h=>ymd(h.t)===ymd(date));
  const b={morn:[],day:[],eve:[],night:[]};
  hours.forEach(h=>{const hr=h.t.getHours();if(hr<6)b.night.push(h);else if(hr<12)b.morn.push(h);else if(hr<18)b.day.push(h);else b.eve.push(h)});
  const avg=a=>a.length?Math.round(a.reduce((s,h)=>s+h.temp,0)/a.length):"—";
  document.getElementById("day-h1").textContent=new Intl.DateTimeFormat("ru-RU",{weekday:"long",day:"numeric",month:"long"}).format(new Date(date));
  document.getElementById("day-body").innerHTML=`<div class="hero"><div class="icon-big">${WMO.symbol(j.daily.weather_code[i])}</div><div class="deg" style="font-size:64px">${tmax}°<span style="font-size:30px;color:#8b90a0">/${tmin}°</span></div><div class="cond">${WMO.short(j.daily.weather_code[i])}</div></div><div class="stats"><div><b>12 км/ч</b><label>Ветер</label></div><div><b>22%</b><label>Влажность</label></div><div><b>${j.daily.precipitation_probability_max[i]}%</b><label>Дождь</label></div></div><div class="card"><div class="periods"><div class="period"><div class="l">Утро</div><div class="tt">${avg(b.morn)}°</div></div><div class="period"><div class="l">День</div><div class="tt">${avg(b.day)}°</div></div><div class="period"><div class="l">Вечер</div><div class="tt">${avg(b.eve)}°</div></div><div class="period"><div class="l">Ночь</div><div class="tt">${avg(b.night)}°</div></div></div></div>`;
  show("day");
}
function render(j){
  const c=j.current,hours=parseHours(j,12);
  document.getElementById("place").textContent="📍 "+state.name;
  document.getElementById("today-body").innerHTML=`<div class="status">Макет v10 · без API</div><div class="hero"><div class="icon-big">${WMO.symbol(c.weather_code)}</div><div class="deg">${Math.round(c.temperature_2m)}°</div><div class="cond">${WMO.short(c.weather_code)}</div><div class="feel">ощущается ${Math.round(c.apparent_temperature)}°</div></div><div class="stats"><div><b>${Math.round(c.wind_speed_10m)} км/ч</b><label>Ветер</label></div><div><b>${c.relative_humidity_2m}%</b><label>Влажность</label></div><div><b>${hours[0]?hours[0].prob:72}%</b><label>Дождь</label></div></div><div class="row-title">Сегодня <small>почасовка</small></div><div class="hours">${hours.map((h,i)=>`<div class="hour ${i===0?"on":""}"><div class="d">${Math.round(h.temp)}°</div><div>${WMO.symbol(h.code)}</div><div class="t">${String(h.t.getHours()).padStart(2,"0")}:00</div></div>`).join("")}</div><div class="row-title">10 дней</div><div class="days">${daysHtml(j)}</div>`;
  document.querySelectorAll(".day").forEach(el=>el.onclick=()=>openDay(+el.dataset.i));
}
const views={today:"view-today",day:"view-day",places:"view-places"};
function show(tab){Object.entries(views).forEach(([k,id])=>document.getElementById(id).classList.toggle("hidden",k!==tab));document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===(tab==="day"?"today":tab)))}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>show(b.dataset.tab));
document.getElementById("back").onclick=()=>show("today");
state.main=mock();render(state.main);
</script>
</body></html>
