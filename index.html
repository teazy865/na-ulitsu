<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="bar-style"/>
<meta name="theme-color" content="#222834" id="theme-color"/>
<title>На улицу</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#222834;--glow:#3a4254;--card:#353c4e;--text:#f4f6fb;--muted:#b3b8c7;--pill:rgba(8,10,14,.88);--bar:rgba(36,40,52,.55)}
html[data-theme="light"]{--bg:#e8ebf1;--glow:#f7f8fb;--card:#fff;--text:#1c1f28;--muted:#6b7284;--pill:rgba(255,255,255,.92);--bar:rgba(230,234,240,.7)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Geist,-apple-system,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 28px) 0 calc(140px + env(safe-area-inset-bottom));background:radial-gradient(900px 460px at 50% -8%,var(--glow) 0%,var(--bg) 58%);transition:background .35s ease,color .35s ease}
.top{text-align:center;font-weight:700;font-size:18px;padding-top:4px}
.hero{text-align:center;margin-top:8px}
.icon-big{position:relative;width:209px;height:209px;margin:0 auto;display:flex;align-items:center;justify-content:center}
.icon-big svg{position:relative;z-index:1}
.aura{position:absolute;width:175%;height:175%;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);filter:blur(32px);pointer-events:none}
.aura.storm{background:radial-gradient(circle,#ffe566 0%,rgba(245,166,35,0) 70%);opacity:.8}
.aura.sun{background:radial-gradient(circle,#ffe9a0 0%,rgba(255,196,60,0) 72%);opacity:.95}
.aura.part{background:radial-gradient(circle,#ffe27a 0%,rgba(255,180,40,0) 70%);opacity:.7}
.aura.rain{background:radial-gradient(circle,#9aa3b2 0%,rgba(90,100,118,0) 70%);opacity:.7}
.aura.cloud,.aura.snow{background:radial-gradient(circle,#c5ccd8 0%,rgba(140,150,168,0) 70%);opacity:.45}
.deg{font-size:108px;font-weight:600;letter-spacing:-5px;line-height:.88;margin-top:2px}
.cond{font-size:24px;margin-top:6px;font-weight:500}.feel{color:var(--muted);font-size:15px;margin-top:6px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border-radius:26px;margin:22px 10vw 0;padding:16px 4px 14px;text-align:center}
.stats div+div{border-left:1px solid rgba(128,128,128,.2)}
.stats .si{display:flex;justify-content:center;margin-bottom:4px;height:26px}
.stats b{display:block;font-size:16px;font-weight:600}.stats label{color:var(--muted);font-size:12px;margin-top:3px;display:block}
.row-title{display:flex;justify-content:space-between;align-items:center;margin:22px 10vw 12px;font-weight:650;font-size:18px}
.row-title .go{color:var(--muted);font-weight:600;font-size:16px;background:0;border:0;padding:0;font-family:inherit}
.hours-clip{margin:0 10vw 28px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hours-clip::-webkit-scrollbar{display:none}
.hours{display:flex;gap:10px;width:max-content}
.hour{width:calc((80vw - 30px) / 4);flex:none;background:var(--card);border-radius:22px;padding:14px 6px 12px;text-align:center}
.hour.on{background:linear-gradient(180deg,#5aa8ff,#2f7bff);color:#fff}
.hour .d{font-weight:700;font-size:20px}.hour .ico{display:flex;justify-content:center;margin:8px 0 6px;height:32px}
.hour .t{color:var(--muted);font-size:12px}.hour.on .t{color:#eef5ff}
.days{padding:0 6.5vw}
.day{display:grid;grid-template-columns:22% 34px 1fr auto;align-items:center;column-gap:10px;min-height:60px}
.day .wd{color:var(--muted);font-weight:600;font-size:16.5px}
.day .ico{display:flex;justify-content:center;align-items:center}
.day .lab{font-weight:600;font-size:17.6px}
.day .temps{justify-self:end;font-weight:700;font-size:16.5px;white-space:nowrap}
.day .temps .mn{color:var(--muted);margin-left:8px}
.card{background:var(--card);border-radius:22px;padding:14px;margin:12px 20px 0}
.detail{color:var(--muted);font-size:13px;margin-top:3px}
.search{width:100%;border:0;border-radius:16px;padding:12px 14px;background:var(--bar);color:var(--text);font-size:16px;font-family:inherit}
button.back{background:0;border:0;color:var(--text);font-size:15px;font-weight:650;padding:0 0 8px 20px;font-family:inherit}
.hidden{display:none!important}
.periods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.period{background:var(--bar);border-radius:16px;padding:12px 4px}
.period .l{color:var(--muted);font-size:12px}.period .tt{font-size:20px;font-weight:700;margin-top:4px}
.hit{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid rgba(128,128,128,.15);color:var(--text);font-size:16px}
.hit .meta{flex:1}.hit .sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.star{width:40px;height:40px;border:0;background:0;color:var(--muted);font-size:22px}.star.on{color:#ffd166}
.dock-wrap{position:fixed;left:0;right:0;bottom:0;padding:18px 28px calc(22px + env(safe-area-inset-bottom));pointer-events:none}
.dock{pointer-events:auto;position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;height:58px;border-radius:999px;background:var(--bar);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.28)}
.dock button{position:relative;z-index:1;height:100%;background:0;border:0;color:var(--text);display:flex;align-items:center;justify-content:center}
.dock svg{width:22px;height:22px}
.glass{position:absolute;top:5px;bottom:5px;width:calc(33.333% - 8px);border-radius:999px;background:var(--pill);transition:left .38s cubic-bezier(.22,.9,.28,1)}
.dock[data-on="places"] .glass{left:4px}.dock[data-on="today"] .glass{left:calc(33.333% + 4px)}.dock[data-on="settings"] .glass{left:calc(66.666% + 4px)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;height:48px;border-radius:999px;background:var(--bar)}
.seg button{z-index:1;background:0;border:0;color:var(--text);font:600 14px Geist,sans-serif}
.seg .g{position:absolute;top:4px;bottom:4px;width:calc(33.333% - 8px);left:4px;border-radius:999px;background:var(--pill);transition:left .38s cubic-bezier(.22,.9,.28,1)}
.seg[data-on="light"] .g{left:calc(33.333% + 4px)}.seg[data-on="dark"] .g{left:calc(66.666% + 4px)}
</style>
</head>
<body>
<div id="view-today"><div class="top" id="place">Москва</div><div id="today-body"></div></div>
<div id="view-days" class="hidden"><button class="back" id="back-days">‹ Назад</button><div class="top">10 дней</div><div id="days-body" class="days" style="margin-top:16px"></div></div>
<div id="view-day" class="hidden"><button class="back" id="back-day">‹ К 10 дням</button><div class="top" id="day-h1"></div><div id="day-body"></div></div>
<div id="view-places" class="hidden"><div class="top">Поиск</div><div class="card"><input class="search" id="q" placeholder="Найти город" autocomplete="off"/><div id="hits" style="margin-top:10px"></div></div></div>
<div id="view-settings" class="hidden"><div class="top">Настройки</div><div class="card"><div style="font-weight:650;margin-bottom:12px">Тема</div><div class="seg" id="theme-seg" data-on="system"><div class="g"></div><button data-th="system">Системная</button><button data-th="light">Светлая</button><button data-th="dark">Тёмная</button></div></div></div>
<div class="dock-wrap"><div class="dock" id="dock" data-on="today"><div class="glass"></div>
<button data-tab="places" aria-label="Поиск"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg></button>
<button data-tab="today" aria-label="Главная"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11l8-7 8 7v8a2 2 0 01-2 2h-3v-6H9v6H6a2 2 0 01-2-2v-8z"/></svg></button>
<button data-tab="settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
</div></div>
<script>
function pic(kind,s=28){
  const n=kind+s;
  const defs=`<defs><linearGradient id="s${n}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE27A"/><stop offset="1" stop-color="#F5B42A"/></linearGradient><linearGradient id="c${n}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#c9d2e0"/></linearGradient><linearGradient id="k${n}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8b95a8"/><stop offset="1" stop-color="#5c6578"/></linearGradient><linearGradient id="z${n}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE566"/><stop offset="1" stop-color="#F5A623"/></linearGradient></defs>`;
  const cloud=`<ellipse cx="20" cy="19" rx="8" ry="6" fill="url(#c${n})"/><ellipse cx="13" cy="20" rx="7" ry="5.4" fill="url(#c${n})"/><ellipse cx="16.5" cy="15" rx="6" ry="5" fill="url(#c${n})"/>`;
  const dark=`<ellipse cx="20" cy="19" rx="8" ry="6" fill="url(#k${n})"/><ellipse cx="13" cy="20" rx="7" ry="5.4" fill="url(#k${n})"/><ellipse cx="16.5" cy="15" rx="6" ry="5" fill="url(#k${n})"/>`;
  let inner=cloud;
  if(kind==="sun") inner=`<circle cx="16" cy="16" r="7.5" fill="url(#s${n})"/><g stroke="#F5B42A" stroke-width="2" stroke-linecap="round"><path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.5 6.5l2 2M23.5 23.5l2 2M6.5 25.5l2-2M23.5 8.5l2-2"/></g>`;
  if(kind==="part") inner=`<circle cx="12" cy="13" r="7" fill="url(#s${n})"/>`+cloud;
  if(kind==="rain") inner=dark+`<g fill="#4DA3FF"><circle cx="12" cy="27" r="1.4"/><circle cx="17" cy="29" r="1.4"/><circle cx="22" cy="27" r="1.4"/></g>`;
  if(kind==="storm") inner=dark+`<path d="M17 14l-5 8h4l-2 7 8-10h-4z" fill="url(#z${n})"/>`;
  if(kind==="snow") inner=cloud+`<g fill="#dfe7f5" font-size="7"><text x="11" y="29">*</text><text x="17" y="31">*</text></g>`;
  if(kind==="wind") inner=`<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 14h16a3 3 0 100-6"/><path d="M6 18h18a3 3 0 110 6"/></g>`;
  if(kind==="drop") inner=`<path d="M16 4c6 8 10 12 10 17a10 10 0 11-20 0c0-5 4-9 10-17z" fill="#4DA3FF"/>`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 32 32">${defs}${inner}</svg>`;
}
function kind(c){if(c===0)return"sun";if(c<=2)return"part";if(c===3)return"cloud";if(c>=95)return"storm";if(c>=71)return"snow";if(c>=61)return"rain";return"cloud"}
const WMO={pic(c,s=28){return pic(kind(c),s)},short(c){if(c<=1)return"Ясно";if(c===2)return"Облачно";if(c===3)return"Пасмурно";if(c>=95)return"Гроза";if(c>=71)return"Снег";if(c>=61)return"Дождь";return"Облачно"}};
function statIcons(wind,hum,rain,code){return{w:pic("wind",22),h:pic("drop",22),r:WMO.pic(rain>=45&&code<61?61:code,22)}}
const WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const COORDS={"Минск":{lat:53.9,lon:27.5667},"Москва":{lat:55.7558,lon:37.6173},"Астана":{lat:51.1694,lon:71.4491},"Алматы":{lat:43.222,lon:76.8512},"Киев":{lat:50.4501,lon:30.5234}};
try{const extra=JSON.parse(localStorage.getItem("extraCities")||"{}");Object.assign(COORDS,extra)}catch(e){}
const CITIES=()=>Object.keys(COORDS);
function mock(){const now=new Date();now.setMinutes(0,0,0);const hourly={time:[],temperature_2m:[],apparent_temperature:[],precipitation_probability:[],weather_code:[]},daily={time:[],weather_code:[],temperature_2m_max:[],temperature_2m_min:[],precipitation_probability_max:[]},codes=[0,2,61,3,95,61,2,0,61,0];for(let d=0;d<10;d++){const day=new Date(now);day.setDate(now.getDate()+d);day.setHours(0,0,0,0);daily.time.push(day.toISOString());daily.weather_code.push(codes[d]);daily.temperature_2m_max.push(20+(d%6));daily.temperature_2m_min.push(14+(d%5));daily.precipitation_probability_max.push([10,20,55,15,80,40,10,5,30,0][d]);for(let h=0;h<24;h++){const t=new Date(day);t.setHours(h);hourly.time.push(t.toISOString());hourly.temperature_2m.push(16+Math.round(6*Math.sin((h-8)/4)));hourly.apparent_temperature.push(15+Math.round(6*Math.sin((h-8)/4)));hourly.precipitation_probability.push(h>=10&&h<=18?20:5);hourly.weather_code.push(codes[d]);}}return{current:{temperature_2m:11,apparent_temperature:10,weather_code:0,relative_humidity_2m:86,wind_speed_10m:4},hourly,daily}}
function parseHours(j,limit){const now=Date.now(),hours=[];if(!j.hourly)return hours;for(let i=0;i<j.hourly.time.length;i++){const t=new Date(j.hourly.time[i]);hours.push({t,temp:j.hourly.temperature_2m[i],app:j.hourly.apparent_temperature[i],prob:j.hourly.precipitation_probability[i],code:j.hourly.weather_code[i]})}return limit?hours.filter(h=>h.t.getTime()>=now-36e5).slice(0,limit):hours}
function ymd(d){const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
const state={name:localStorage.getItem("favCity")||"Москва",main:null,live:false};
function daysHtml(j){return j.daily.time.map((d,i)=>`<div class="day" data-i="${i}"><div class="wd">${WD[new Date(d).getDay()]}</div><div class="ico">${WMO.pic(j.daily.weather_code[i],29)}</div><div class="lab">${WMO.short(j.daily.weather_code[i])}</div><div class="temps">+${Math.round(j.daily.temperature_2m_max[i])}°<span class="mn">+${Math.round(j.daily.temperature_2m_min[i])}°</span></div></div>`).join("")}
function bindDays(){document.querySelectorAll("#days-body .day").forEach(el=>el.onclick=()=>openDay(+el.dataset.i))}
function openDays(){if(!state.main)return;document.getElementById("days-body").innerHTML=daysHtml(state.main);bindDays();show("days")}
function heroIcon(code,size){return `<div class="icon-big"><div class="aura ${kind(code)}"></div>${WMO.pic(code,size)}</div>`}
function openDay(i){
  const j=state.main,date=j.daily.time[i],tmax=Math.round(j.daily.temperature_2m_max[i]),tmin=Math.round(j.daily.temperature_2m_min[i]);
  const hours=parseHours(j).filter(h=>ymd(h.t)===ymd(date));
  const b={morn:[],day:[],eve:[],night:[]};
  hours.forEach(h=>{const hr=h.t.getHours();if(hr<6)b.night.push(h);else if(hr<12)b.morn.push(h);else if(hr<18)b.day.push(h);else b.eve.push(h)});
  const avg=a=>a.length?Math.round(a.reduce((s,h)=>s+h.temp,0)/a.length):"—";
  const ic=statIcons(12,22,j.daily.precipitation_probability_max[i],j.daily.weather_code[i]);
  document.getElementById("day-h1").textContent=new Intl.DateTimeFormat("ru-RU",{weekday:"long",day:"numeric",month:"long"}).format(new Date(date));
  document.getElementById("day-body").innerHTML=`<div class="hero">${heroIcon(j.daily.weather_code[i],132)}<div class="deg" style="font-size:64px">${tmax}°<span style="font-size:30px;color:var(--muted)">/${tmin}°</span></div><div class="cond">${WMO.short(j.daily.weather_code[i])}</div></div><div class="stats"><div><span class="si">${ic.w}</span><b>—</b><label>Ветер</label></div><div><span class="si">${ic.h}</span><b>—</b><label>Влажность</label></div><div><span class="si">${ic.r}</span><b>${j.daily.precipitation_probability_max[i]}%</b><label>Дождь</label></div></div><div class="card"><div class="periods"><div class="period"><div class="l">Утро</div><div class="tt">${avg(b.morn)}°</div></div><div class="period"><div class="l">День</div><div class="tt">${avg(b.day)}°</div></div><div class="period"><div class="l">Вечер</div><div class="tt">${avg(b.eve)}°</div></div><div class="period"><div class="l">Ночь</div><div class="tt">${avg(b.night)}°</div></div></div></div>`;
  show("day");
}
function render(j){
  const c=j.current||{},hours=parseHours(j,16),rain=hours[0]?hours[0].prob:0;
  const ic=statIcons(c.wind_speed_10m||0,c.relative_humidity_2m||0,rain,c.weather_code||0);
  document.getElementById("place").textContent=state.name;
  document.getElementById("today-body").innerHTML=`<div class="hero">${heroIcon(c.weather_code||0,141)}<div class="deg">${Math.round(c.temperature_2m)}°</div><div class="cond">${WMO.short(c.weather_code||0)}</div><div class="feel">ощущается ${Math.round(c.apparent_temperature)}°</div></div><div class="stats"><div><span class="si">${ic.w}</span><b>${Math.round(c.wind_speed_10m||0)} км/ч</b><label>Ветер</label></div><div><span class="si">${ic.h}</span><b>${c.relative_humidity_2m||0}%</b><label>Влажность</label></div><div><span class="si">${ic.r}</span><b>${rain}%</b><label>Дождь</label></div></div><div class="row-title">Сегодня <button class="go" id="open-days">10 дней ›</button></div><div class="hours-clip"><div class="hours">${hours.map((h,i)=>`<div class="hour ${i===0?"on":""}"><div class="d">${Math.round(h.temp)}°</div><span class="ico">${WMO.pic(h.code,32)}</span><div class="t">${String(h.t.getHours()).padStart(2,"0")}:00</div></div>`).join("")}</div></div>`;
  document.getElementById("open-days").onclick=openDays;
}
function rememberCity(name,lat,lon){COORDS[name]={lat,lon};const extra=JSON.parse(localStorage.getItem("extraCities")||"{}");extra[name]={lat,lon};localStorage.setItem("extraCities",JSON.stringify(extra))}
async function loadCity(name){
  state.name=name;
  const c=COORDS[name]||COORDS["Москва"];
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=10&timezone=auto`;
  try{const r=await fetch(url);if(!r.ok)throw 0;state.main=await r.json();state.live=true;}catch(e){state.main=mock();state.live=false;}
  render(state.main);
}
function drawHits(list){
  const fav=localStorage.getItem("favCity")||"Москва";
  const rows=list||CITIES().map(n=>({name:n,sub:"",lat:COORDS[n].lat,lon:COORDS[n].lon}));
  document.getElementById("hits").innerHTML=rows.length?rows.map(r=>`<div class="hit"><div class="meta" data-n="${r.name}" data-lat="${r.lat}" data-lon="${r.lon}"><span>${r.name}${r.name===fav?" · по умолчанию":""}</span>${r.sub?`<span class="sub">${r.sub}</span>`:""}</div><button class="star ${r.name===fav?"on":""}" data-n="${r.name}" data-lat="${r.lat}" data-lon="${r.lon}">${r.name===fav?"★":"☆"}</button></div>`).join(""):`<div class="detail">Ничего не найдено</div>`;
  document.querySelectorAll("#hits .meta").forEach(el=>el.onclick=()=>{rememberCity(el.dataset.n,+el.dataset.lat,+el.dataset.lon);loadCity(el.dataset.n);show("today")});
  document.querySelectorAll("#hits .star").forEach(el=>el.onclick=e=>{e.stopPropagation();rememberCity(el.dataset.n,+el.dataset.lat,+el.dataset.lon);localStorage.setItem("favCity",el.dataset.n);drawHits();loadCity(el.dataset.n)});
}
let tmr=null;
document.getElementById("q").addEventListener("input",()=>{
  const s=document.getElementById("q").value.trim();
  clearTimeout(tmr);
  if(s.length<2){drawHits();return}
  tmr=setTimeout(async()=>{
    try{
      const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(s)+"&count=8&language=ru&format=json");
      const j=await r.json();
      const rows=(j.results||[]).map(x=>({name:x.name,lat:x.latitude,lon:x.longitude,sub:[x.admin1,x.country].filter(Boolean).join(", ")}));
      drawHits(rows);
    }catch(e){document.getElementById("hits").innerHTML=`<div class="detail">Сеть недоступна</div>`}
  },280);
});
const views={today:"view-today",days:"view-days",day:"view-day",places:"view-places",settings:"view-settings"};
function show(tab){const dockTab=(tab==="days"||tab==="day")?"today":tab;Object.entries(views).forEach(([k,id])=>document.getElementById(id).classList.toggle("hidden",k!==tab));document.getElementById("dock").dataset.on=dockTab}
document.querySelectorAll("#dock button").forEach(b=>b.onclick=()=>show(b.dataset.tab));
document.getElementById("back-days").onclick=()=>show("today");
document.getElementById("back-day").onclick=openDays;
function applyTheme(mode){
  const sys=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
  const t=mode==="system"?sys:mode;
  document.documentElement.dataset.theme=t;
  document.getElementById("theme-seg").dataset.on=mode;
  document.getElementById("theme-color").setAttribute("content",t==="light"?"#e8ebf1":"#222834");
  document.getElementById("bar-style").setAttribute("content",t==="light"?"default":"black-translucent");
  localStorage.setItem("theme",mode);
}
document.querySelectorAll("#theme-seg button").forEach(b=>b.onclick=()=>applyTheme(b.dataset.th));
applyTheme(localStorage.getItem("theme")||"system");
matchMedia("(prefers-color-scheme: light)").addEventListener("change",()=>{if((localStorage.getItem("theme")||"system")==="system")applyTheme("system")});
drawHits();
loadCity(state.name);
