name: NaUlitsu
options:
  bundleIdPrefix: com.teazy
  deploymentTarget:
    iOS: "16.0"
settings:
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "20"
targets:
  NaUlitsu:
    type: application
    platform: iOS
    sources:
      - path: NaUlitsu
    info:
      path: NaUlitsu/Info.plist
      properties:
        CFBundleDisplayName: На улицу
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "20"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.teazy.naulitsu
      TARGETED_DEVICE_FAMILY: "1"
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      INFOPLIST_FILE: NaUlitsu/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO
